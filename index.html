<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>DarkPDF</title>
  <link rel="stylesheet" href="viewer.css?v=6">
</head>
<body>
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <filter id="gemini-colors" color-interpolation-filters="sRGB">
      <!-- czerń → #0f0f0f, biel → #e3e3e3 (kolory Gemini: tło body, --gem-sys-color--on-surface) -->
      <feComponentTransfer>
        <feFuncR type="linear" slope="0.8314" intercept="0.0588"/>
        <feFuncG type="linear" slope="0.8314" intercept="0.0588"/>
        <feFuncB type="linear" slope="0.8314" intercept="0.0588"/>
      </feComponentTransfer>
    </filter>
  </svg>
  <div id="stage"></div>
  <div id="hint" hidden></div>

  <div id="welcome">
    <div class="card">
      <div class="logo">DarkPDF</div>
      <p class="lead">Przeciągnij plik PDF tutaj albo kliknij, żeby go wybrać.</p>
      <button class="pick" type="button">Wybierz plik PDF</button>
      <div class="keys">
        <kbd>← →</kbd><span>przewijanie stron</span>
        <kbd>P</kbd><span>jedna albo dwie strony</span>
        <kbd>D</kbd><span>tryb ciemny</span>
        <kbd>T</kbd><span>motyw zwykły albo Gemini</span>
        <kbd>O</kbd><span>parowanie stron</span>
        <kbd>F</kbd><span>pełny ekran</span>
        <kbd>1 2 3 ⏎</kbd><span>skok do strony</span>
      </div>
      <p class="foot">Kliknięcie w stronę otwiera pasek z przyciskami. Plik nie jest nigdzie wysyłany.</p>
    </div>
  </div>

  <div id="menu" hidden>
    <button data-k="prev" title="Poprzednia strona (←)">◀</button>
    <span class="pos"></span>
    <button data-k="next" title="Następna strona (→)">▶</button>
    <span class="sep"></span>
    <button data-k="pages" title="P"></button>
    <button data-k="pairing" title="O"></button>
    <button data-k="dark" title="D"></button>
    <button data-k="theme" title="T"></button>
    <button data-k="full">Pełny ekran <span class="k">(F)</span></button>
    <button data-k="open">Otwórz plik <span class="k">(Ctrl+O)</span></button>
  </div>
  <main id="text" class="sr-only" aria-label="Tekst dokumentu"></main>
  <script type="module" src="viewer.js?v=6"></script>
</body>
</html>
